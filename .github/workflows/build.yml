
      - name: Check Manifest XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "app/src/main/AndroidManifest.xml"
          try:
              ET.parse(path)
              print("Manifest XML syntax: OK")
          except ET.ParseError as e:
              print(f"Manifest XML error: {e}")
              raise
          PY

      - name: Build APK
        run: gradle assembleDebug --stacktrace --info
